# SSH fixtures, not secrets. They exist so the key-import tests can cover every format
# JSch is asked to accept, and so the on-device SSH/SFTP suite has a client key:
#
#   app/src/{test/resources,androidTest/assets}/keys/
#     test_ed25519        unencrypted, comment "screenlink-test"
#     test_rsa_pass       passphrase "pass123" - written in KeyValidationTest.kt
#     test_rsa_pkcs1_enc  passphrase "keypass" - written in KeyValidationTest.kt
#
# Their passphrases are published in the test source, so they protect nothing; none of
# them is authorized on any host this project uses, and they never reach users - the
# androidTest copies stay in the androidTest APK, not the app APK.
#
# GitHub's scanner matches the OpenSSH/PEM header rather than the meaning of the file, so
# it alerts on all four. paths-ignore closes those alerts as "ignored by configuration"
# and exempts only these two directories from push protection; everything else in the
# repository is still scanned. Real signing and SSH material stays covered by the
# .gitignore rules (*.p12, *.jks, *.pem, ...) - keystore/sideload.p12 is the single
# deliberate, documented exception and is a throwaway sideload key.
paths-ignore:
  - "app/src/test/resources/keys/**"
  - "app/src/androidTest/assets/keys/**"
