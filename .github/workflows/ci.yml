# The gate this project runs by hand, on every push and pull request: unit tests, lint
# and the debug APK - the one that is actually published and installed. Nothing is
# published from here; a v* tag does that, see release.yml.
#
# What is deliberately NOT here: the instrumented suite
# (`:app:connectedDebugAndroidTest` - Room migrations, real SSH/SFTP, the Compose UI)
# needs an emulator and stays a local pre-release step.
#
# Actions are pinned to commit SHAs instead of moving major tags, the same way the
# vendored terminal sources are pinned. Bump them on purpose, not by surprise.
name: CI

on:
  push:
    # `main` is listed only so a branch rename cannot silently stop the badge.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# No paths-ignore: a docs-only commit still has to keep the badge honest.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # ANDROID_HOME plus exactly the components this project builds against; the repo
      # keeps no local.properties, so the SDK location comes from the environment.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Gradle distribution + dependency cache, keyed off the build files.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      # Debug only: it is the variant the tests run against and the variant a tag
      # publishes. The minified release variant is built locally, not in CI - see
      # release.yml for why nothing minified is shipped.
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
